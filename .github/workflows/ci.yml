name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickets" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s
          --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tickets:tickets@localhost:5432/tickets_test
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Tests (включая проверку границ модулей)
        run: uv run pytest -q
      - name: Миграции соответствуют моделям
        run: uv run alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: OpenAPI-контракт закоммичен
        run: |
          uv run python -m scripts.export_openapi ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json             || (echo "::error::openapi.json устарел: выполни export_openapi и npm run gen:api" && exit 1)

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Сгенерированный клиент соответствует openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/generated             || (echo "::error::src/api/generated устарел: выполни npm run gen:api" && exit 1)
      - run: npm run lint
      - run: npm run build
