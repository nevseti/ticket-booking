# Общие location для HTTP- и HTTPS-вариантов сервера.

root /usr/share/nginx/html;

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/app/proxy-api.conf;
}

# Вход и регистрация: подбор паролей отсекается ещё до приложения.
location /api/auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/app/proxy-api.conf;
}

# SSE схемы зала: не больше 10 открытых потоков с одного IP (вкладки одного человека
# укладываются, тысяча соединений от одного скрипта — нет).
location ~ ^/api/events/[^/]+/seatmap/stream$ {
    limit_conn streams 10;
    include /etc/nginx/app/proxy-api.conf;
}

# Ответ на превышение лимита nginx — в том же формате, что и у приложения (Problem
# Details), чтобы фронтенд показал понятное сообщение. Ответы 429 самого приложения
# сюда не попадают (proxy_intercept_errors выключен) и идут к клиенту как есть.
error_page 429 = @rate_limited;
location @rate_limited {
    default_type "application/problem+json; charset=utf-8";
    add_header Retry-After 1 always;
    return 429 '{"type":"about:blank","title":"Слишком много запросов","status":429,"code":"RATE_LIMITED","detail":"Слишком много запросов подряд. Повторите через несколько секунд.","retry_after":1}';
}

# Веб-интерфейс Mailpit (письма с билетами на демо). Пароль — MP_UI_AUTH в .env.
location /mailpit/ {
    set $mailpit_upstream http://mailpit:8025;
    proxy_pass $mailpit_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Ассеты Vite с хэшем в имени — кэшируются навсегда.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Фото афиш: файлы не меняются, кэшируются на месяц.
location /posters/ {
    expires 30d;
    try_files $uri =404;
}

# SPA: все неизвестные пути отдают index.html, который не кэшируется.
location / {
    expires -1;
    try_files $uri /index.html;
}
