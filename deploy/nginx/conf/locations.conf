# Общие location для HTTP- и HTTPS-вариантов сервера.

root /usr/share/nginx/html;

location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}

# Ассеты Vite с хэшем в имени — кэшируются навсегда.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Фото афиш: файлы не меняются, кэшируются на месяц.
location /posters/ {
    expires 30d;
    try_files $uri =404;
}

# SPA: все неизвестные пути отдают index.html, который не кэшируется.
location / {
    expires -1;
    try_files $uri /index.html;
}
