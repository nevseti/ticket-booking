# Проксирование на api (подключается в location /api/...).
set $api_upstream http://api:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx — первая точка входа, поэтому адрес клиента берём у соединения и ПЕРЕЗАПИСЫВАЕМ
# X-Forwarded-For (а не дописываем к присланному): иначе клиент подделал бы свой IP и
# обходил лимиты по IP в приложении.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
client_max_body_size 2m;
