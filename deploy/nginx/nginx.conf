user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json
               image/svg+xml text/plain;

    # DNS Docker: адрес api разрешается при каждом запросе (через переменную в proxy_pass),
    # поэтому nginx стартует, даже если api ещё не поднялся, и переживает его перезапуск.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Ограничение частоты — первый рубеж, по IP и без Redis (docs/adr/0008). Точные лимиты
    # на пользователя — в приложении; здесь пороги выше, чтобы не мешать живым людям.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=streams:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # WebSocket (живое обновление списка писем в Mailpit)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
