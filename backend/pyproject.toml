[project]
name = "ticket-booking-backend"
version = "0.1.0"
description = "Ticket booking: modular monolith (FastAPI) + background worker"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "redis>=5.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "tzdata>=2026.5",
    "aio-pika>=10.1.1",
    "aiosmtplib>=5.1.3",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
# Приложение запускается из каталога backend/, как пакет не устанавливается.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",    # Depends(...) в аргументах по умолчанию — идиома FastAPI
    "RUF001",  # кириллица в строках — это нормально
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
